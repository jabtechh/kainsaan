version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: kainsaan-db
    environment:
      POSTGRES_DB: kainsaan
      POSTGRES_USER: kainsaan_user
      POSTGRES_PASSWORD: devpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kainsaan_user -d kainsaan"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: kainsaan-web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 2 --reload kainsaan.wsgi:application"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      SECRET_KEY: "dev-secret-key-change-in-production"
      DB_NAME: kainsaan
      DB_USER: kainsaan_user
      DB_PASSWORD: devpassword
      DB_HOST: db
      DB_PORT: 5432
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      GOOGLE_PLACES_API_KEY: "${GOOGLE_PLACES_API_KEY}"
      GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
