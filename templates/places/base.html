<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Kain Saan - Random restaurant picker for Filipino foodies">
    <meta name="theme-color" content="#EF4444">
    
    <title>{% block title %}Kain Saan - Kahit Saan!{% endblock %}</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/static/manifest.json">
    
    <!-- Favicon / App Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    
    <!-- Tailwind CSS from CDN (for quick development) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Tailwind config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'kain-red': '#EF4444',
                        'kain-yellow': '#FBBF24',
                    }
                }
            }
        }
    </script>
    
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-gradient-to-br from-kain-red to-kain-yellow min-h-screen">
    {% block content %}{% endblock %}
    
    {% block extra_js %}{% endblock %}
    
    <!-- Register Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/service-worker.js')
                    .then(reg => console.log('Service Worker registered:', reg.scope))
                    .catch(err => console.error('Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
