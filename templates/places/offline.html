<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Kain Saan</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-red-500 to-yellow-400 min-h-screen flex items-center justify-center px-4">
    <div class="bg-white rounded-2xl shadow-2xl p-8 text-center max-w-md">
        <div class="text-6xl mb-4">📡</div>
        <h1 class="text-3xl font-bold text-gray-900 mb-4">
            No Internet Connection
        </h1>
        <p class="text-gray-600 mb-6">
            Please check your internet connection and try again.
        </p>
        <button 
            onclick="location.reload()" 
            class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-6 rounded-lg transition duration-200"
        >
            Try Again
        </button>
    </div>
</body>
</html>
